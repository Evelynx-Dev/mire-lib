[project]
name = "mire"
version = "0.0.1"
description = "Standard library for the Mire language"
entry = "code/mod.mire"

[build]
compiler = "mire"
profile = "debug"
opt-level = 0

[paths]
sources = "."
tests = "tests"
output = "bin"
cache = "bin/.cache"

[exports]
vec  = "core/vec"
map  = "core/map"
str  = "core/str"
io   = "core/io"
math = "core/math"
